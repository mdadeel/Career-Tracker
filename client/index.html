<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0064FF" />
    <meta name="color-scheme" content="light dark" />

    <!-- Primary SEO -->
    <title>CareerTrack — Job Application Tracker, Pipeline & Analytics</title>
    <meta name="description" content="CareerTrack is a free, private job application tracker. Organize applications, manage a kanban pipeline, track interviews and offers, and measure response rates with real-time analytics." />
    <meta name="author" content="Shahnawas Adeel" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Canonical -->
    <link rel="canonical" href="https://careertrack.app/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="CareerTrack Lite" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CareerTrack — Job Application Tracker, Pipeline & Analytics" />
    <meta property="og:description" content="Track every job application with surgical precision. Free kanban pipeline, interviews, offers, and analytics." />
    <meta property="og:url" content="https://careertrack.app/" />
    <meta property="og:image" content="https://careertrack.app/og-cover.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CareerTrack — Job Application Tracker, Pipeline & Analytics" />
    <meta name="twitter:description" content="Track every job application with surgical precision. Free kanban pipeline, interviews, offers, and analytics." />
    <meta name="twitter:image" content="https://careertrack.app/og-cover.png" />

    <!-- Security / privacy -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data (fallback when JS not executed; pages enrich via SEO component) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CareerTrack Lite",
        "url": "https://careertrack.app/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "CareerTrack is a free, private job application tracker with a kanban pipeline, interview calendar, and analytics.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Shahnawas Adeel" }
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700;8..60,800;8..60,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Skip link for accessibility -->
    <style>
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 100;
        background: #0064FF;
        color: #fff;
        padding: 0.75rem 1rem;
        border-radius: 0 0 0.5rem 0;
        font: 600 0.875rem/1.25rem system-ui, sans-serif;
      }
      .skip-link:focus-visible {
        left: 0;
      }
      .app-shell-loader {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #F2EFE8;
      }
      .app-shell-loader::after {
        content: "";
        width: 32px;
        height: 32px;
        border: 3px solid rgba(0, 100, 255, 0.25);
        border-top-color: #0064FF;
        border-radius: 50%;
        animation: ct-spin 0.8s linear infinite;
      }
      @keyframes ct-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-shell-loader::after { animation-duration: 2s; }
      }
    </style>
  </head>
  <body class="bg-surface-secondary text-ink antialiased">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="root">
      <div class="app-shell-loader" role="status" aria-label="Loading CareerTrack"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
