name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: careertrack_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/careertrack_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: cd server && npm ci
      - name: Generate Prisma client
        run: cd server && npx prisma generate
      - name: Push schema to test DB
        run: cd server && npx prisma db push
      - name: Run server tests
        run: cd server && npm test

  test-client:
    name: Client Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: cd client && npm ci
      - name: TypeScript check
        run: cd client && npx tsc --noEmit
      - name: Run client tests
        run: cd client && npm test

  typecheck-server:
    name: Server TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: cd server && npm ci
      - name: Generate Prisma client
        run: cd server && npx prisma generate
      - name: TypeScript check
        run: cd server && npx tsc --noEmit

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test-server, test-client, typecheck-server]
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/careertrack_test?schema=public
      JWT_SECRET: ci-build-secret
      NODE_ENV: production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: careertrack_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server deps & build
        run: |
          cd server && npm ci
          npx prisma generate
          npm run build
      - name: Install client deps & build
        run: |
          cd client && npm ci
          VITE_API_URL=https://api.example.com npm run build
      - name: Verify build artifacts
        run: |
          ls server/dist/server.js && echo "✅ Server build OK"
          ls client/dist/index.html && echo "✅ Client build OK"
